[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wii-ai-golf"
version = "0.1.0"
description = "Multi-agent research framework for Wii Sports Golf: Hitting the Green"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
bayes = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

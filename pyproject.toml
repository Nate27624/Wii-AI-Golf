[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wii-ai-golf"
version = "0.1.0"
description = "Multi-agent research framework for Wii Sports Golf: Hitting the Green"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
bayes = ["numpy>=1.24"]
visual = ["Pillow>=10.2", "numpy>=1.24"]
visual-fast = ["Pillow>=10.2", "numpy>=1.24", "numba>=0.68.1,<0.69"]

[project.scripts]
wii-golf = "wii_ai_golf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

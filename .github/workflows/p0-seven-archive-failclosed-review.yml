name: P0 seven archive failclosed regression (synthetic)
on:
  push:
    paths:
      - 'scripts/audit_p0_seven_numbered_source_pairs_private.py'
      - 'tests/test_p0_seven_archive_failclosed_review.py'
      - '.github/workflows/p0-seven-archive-failclosed-review.yml'
  pull_request:
    paths:
      - 'scripts/audit_p0_seven_numbered_source_pairs_private.py'
      - 'tests/test_p0_seven_archive_failclosed_review.py'
      - '.github/workflows/p0-seven-archive-failclosed-review.yml'
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Seven original synthetic tests and archive failclosed review
        run: |
          python -m unittest discover -s tests -p test_p0_seven_numbered_source_pairs_private.py -v
          python -m unittest discover -s tests -p test_p0_seven_archive_failclosed_review.py -v

name: P0 memory capture and variable validation (synthetic offline)

on:
  pull_request:
    paths:
      - 'scripts/p0_capture_manifest_preflight.py'
      - 'tests/test_p0_capture_manifest_preflight.py'
      - 'scripts/p0_stage_private_capture.ps1'
      - 'tests/test_p0_stage_private_capture.py'
      - 'scripts/p0_archive_variable_differential_private.py'
      - 'tests/test_p0_archive_variable_differential_private.py'
      - 'scripts/p0_live_directional_aim_series.py'
      - 'scripts/run_p0_live_directional_aim_series.ps1'
      - 'tests/test_p0_live_directional_aim_series.py'
      - 'scripts/p0_live_no_contact_compare.py'
      - 'scripts/run_p0_live_no_contact_compare.ps1'
      - 'tests/test_p0_live_no_contact_compare.py'
      - 'scripts/p0_variable_validation_matrix.py'
      - 'tests/test_p0_variable_validation_matrix.py'
      - '.github/workflows/p0-capture-manifest-preflight.yml'
  workflow_dispatch:

jobs:
  p0-memory-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional Bayesian regression dependency
        run: python -m pip install -e ".[bayes]"
      - name: Manager capture integrity tests
        run: python -m unittest discover -s tests -p test_p0_capture_manifest_preflight.py -v
      - name: S001 PowerShell stage tests (synthetic banks only, no Dolphin)
        run: python -m unittest discover -s tests -p test_p0_stage_private_capture.py -v
      - name: S002 archive differential tests (synthetic banks only, no Dolphin)
        run: python -m unittest discover -s tests -p test_p0_archive_variable_differential_private.py -v
      - name: S003 P0 variable falsification tests (synthetic metadata only)
        run: python -m unittest discover -s tests -p test_p0_variable_validation_matrix.py -v
      - name: S000 local no-contact read-only source-candidate experiment tests
        run: python -m unittest discover -s tests -p test_p0_live_no_contact_compare.py -v
      - name: S000 directional aim series new source/negative control synthetic tests
        run: python -m unittest discover -s tests -p test_p0_live_directional_aim_series.py -v
      - name: Full offline Python suite
        run: python -m unittest discover -s tests -v

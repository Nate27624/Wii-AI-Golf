name: P0 seven-state24 synthetic only
on:
  push:
    paths:
      - 'scripts/audit_p0_seven_state24_private.py'
      - 'tests/test_p0_seven_state24_private.py'
      - '.github/workflows/p0-seven-state24-synthetic.yml'
      - 'research/studies/P0-SEVEN-STATE24-01.md'
  pull_request:
    paths:
      - 'scripts/audit_p0_seven_state24_private.py'
      - 'tests/test_p0_seven_state24_private.py'
      - '.github/workflows/p0-seven-state24-synthetic.yml'
      - 'research/studies/P0-SEVEN-STATE24-01.md'
  workflow_dispatch:
jobs:
  synthetic:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Python syntax
        run: python -m py_compile scripts/audit_p0_seven_state24_private.py tests/test_p0_seven_state24_private.py
      - name: Synthetic tests (NO private memory)
        run: python -m unittest discover -s tests -p 'test_p0_seven_state24_private.py' -v

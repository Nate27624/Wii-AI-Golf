name: M1.5 human terminal result-first regression

on:
  pull_request:
    paths:
      - "scripts/collect_outcome_transition.py"
      - "scripts/research_cli.py"
      - "tests/test_m15_visual_first.py"
      - "tests/test_outcome_capture_cli.py"
      - "tests/test_research_cli.py"
      - "src/wii_ai_golf/evaluation.py"
      - "tests/test_evaluation_real_gate.py"
      - "tests/test_training_real_gate.py"
      - "src/wii_ai_golf/bayes.py"
      - "tests/test_bayes.py"
      - "src/wii_ai_golf/agents.py"
      - "tests/test_elite_reward_gate.py"
      - "src/wii_ai_golf/emulator.py"
      - "tests/test_emulator_scenario_gate.py"
      - ".github/workflows/m15-visual-first.yml"
  workflow_dispatch:

jobs:
  m15-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional Bayesian dependency for non-skipped tests
        run: |
          python -m pip install -e ".[bayes]"
          python -c "import numpy; print('NumPy available:', numpy.__version__)"
      - name: Focused offline M1.5 + preexisting collector/publisher tests
        run: |
          python -m unittest discover -s tests -p "test_m15_visual_first.py" -v
          python -m unittest discover -s tests -p "test_outcome_capture_cli.py" -v
          python -m unittest discover -s tests -p "test_research_cli.py" -v
          python -m unittest discover -s tests -p "test_evaluation_real_gate.py" -v
          python -m unittest discover -s tests -p "test_emulator_scenario_gate.py" -v
          python -m unittest discover -s tests -p "test_training_real_gate.py" -v
          python -m unittest discover -s tests -p "test_bayes.py" -v
          # The S005 test file is present on PR #370, not this workflow-only PR.
          # Running discovery here will be zero tests until that PR is rebased.
          python -m unittest discover -s tests -p "test_elite_reward_gate.py" -v
      - name: Full offline Python suite (Windows and Ubuntu)
        run: python -m unittest discover -s tests -v

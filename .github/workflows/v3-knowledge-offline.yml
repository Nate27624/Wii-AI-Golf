name: V3 staged knowledge offline
on:
  pull_request:
    paths:
      - 'ONBOARDING.md'
      - 'GOALS.md'
      - 'ROADMAP.md'
      - 'FINDINGS.md'
      - 'tests/test_v3_knowledge_contract.py'
      - '.github/workflows/v3-knowledge-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -p 'test_v3_knowledge_contract.py' -v
      - run: python -m unittest discover -s tests -v

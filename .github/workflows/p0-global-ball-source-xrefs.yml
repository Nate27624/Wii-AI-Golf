name: S002 global ball source slot references offline

on:
  push:
    paths:
      - 'scripts/audit_p0_global_ball_source_xrefs_private.py'
      - 'tests/test_p0_global_ball_source_xrefs_private.py'
      - '.github/workflows/p0-global-ball-source-xrefs.yml'
  pull_request:
    paths:
      - 'scripts/audit_p0_global_ball_source_xrefs_private.py'
      - 'tests/test_p0_global_ball_source_xrefs_private.py'
      - '.github/workflows/p0-global-ball-source-xrefs.yml'
  workflow_dispatch:

jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run private native-free source global xref tests
        run: python -m unittest discover -s tests -p 'test_p0_global_ball_source_xrefs_private.py' -v
      - name: Full offline regression suite (no Dolphin)
        run: python -m unittest discover -s tests -v

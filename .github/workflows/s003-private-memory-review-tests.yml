name: S003 private temporal evidence unit tests
on:
  pull_request:
    paths:
      - 'src/wii_ai_golf/modeling/golfer_probe_review.py'
      - 'src/wii_ai_golf/modeling/golfer_temporal_private.py'
      - 'scripts/analyze_golfer_temporal_private.py'
      - 'tests/test_model_golfer_probe_review.py'
      - 'tests/test_model_golfer_temporal_private.py'
      - '.github/workflows/s003-private-memory-review-tests.yml'
  workflow_dispatch:
jobs:
  evidence-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile scripts and model
        run: python -m compileall -q src scripts tests
      - name: Test S003 v2 scene summary compatibility
        run: python -m unittest discover -s tests -p 'test_model_golfer_probe_review.py' -v
      - name: Test private temporal redaction and frame checks
        run: python -m unittest discover -s tests -p 'test_model_golfer_temporal_private.py' -v
      - name: Full repository regression
        run: python -m unittest discover -s tests -v

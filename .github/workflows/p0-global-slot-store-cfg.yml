name: S002 global pointer stw bounded PPC CFG

on:
  push:
    paths:
      - 'scripts/review_p0_global_slot_store_cfg.py'
      - 'tests/test_p0_global_slot_store_cfg_private.py'
      - 'scripts/audit_p0_global_ball_source_xrefs_private.py'
      - '.github/workflows/p0-global-slot-store-cfg.yml'
  pull_request:
    paths:
      - 'scripts/review_p0_global_slot_store_cfg.py'
      - 'tests/test_p0_global_slot_store_cfg_private.py'
      - 'scripts/audit_p0_global_ball_source_xrefs_private.py'
      - '.github/workflows/p0-global-slot-store-cfg.yml'
  workflow_dispatch:

jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test branch-bounded writer value classifier
        run: python -m unittest discover -s tests -p 'test_p0_global_slot_store_cfg_private.py' -v
      - name: Retest existing sole-writer source controls
        run: python -m unittest discover -s tests -p 'test_p0_global_ball_writer_value_private.py' -v

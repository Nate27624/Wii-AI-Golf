name: P0 source-only LocalOps research safety
on:
  pull_request:
    paths:
      - 'scripts/audit_p0_localops_rev1_study.py'
      - 'tests/test_p0_localops_rev1_study.py'
      - '.github/workflows/p0-localops-rev1-study-offline.yml'
  push:
    branches:
      - 'agent/p0-localops-rev1-source-preflight-20261112'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m py_compile scripts/audit_p0_localops_rev1_study.py tests/test_p0_localops_rev1_study.py
      - name: Focused no-private-data negative controls
        run: python -I -m unittest discover -s tests -p test_p0_localops_rev1_study.py -v
      - name: Install offline test dependency
        run: python -m pip install numpy
      - name: Full offline regression
        run: python -m unittest discover -s tests -v

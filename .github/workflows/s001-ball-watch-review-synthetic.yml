name: S001 ball-watch review regression (synthetic only)
on:
  push:
    branches:
      - agent/review/ball-watch-false-positive-gates-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    name: Offline report guards / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m compileall -q scripts/record_selected_ball_swing_private.py tests/test_ball_watch_report.py
      - run: python -m unittest discover -s tests -p "test_ball_watch_*.py" -v

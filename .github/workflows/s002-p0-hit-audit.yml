name: S002 P0 private successful-hit audit
on:
  pull_request:
    paths:
      - 'scripts/audit_p0_successful_shot_private.py'
      - 'tests/test_p0_successful_shot_private.py'
      - '.github/workflows/s002-p0-hit-audit.yml'
  workflow_dispatch:
jobs:
  offline-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic fail-closed privacy and source-offset tests
        run: python -m unittest discover -s tests -p test_p0_successful_shot_private.py -v
      - name: Compile audit tool
        run: python -m compileall -q scripts/audit_p0_successful_shot_private.py tests/test_p0_successful_shot_private.py
  offline-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic fail-closed privacy and source-offset tests
        run: python -m unittest discover -s tests -p test_p0_successful_shot_private.py -v
      - name: Compile audit tool
        run: python -m compileall -q scripts/audit_p0_successful_shot_private.py tests/test_p0_successful_shot_private.py

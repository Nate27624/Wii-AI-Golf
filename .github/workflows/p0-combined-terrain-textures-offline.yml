name: P0 combined solid terrain and original UV textures offline

on:
  pull_request:
    paths:
      - 'src/wii_ai_golf/inspector/gui.py'
      - 'src/wii_ai_golf/inspector/visual_model.py'
      - 'src/wii_ai_golf/inspector/dae_visual.py'
      - 'tests/test_p0_memory_inspector_dae_visual.py'
      - 'src/wii_ai_golf/inspector/texture_render.py'
      - 'src/wii_ai_golf/inspector/textured_preview.py'
      - 'src/wii_ai_golf/inspector/navigation.py'
      - 'src/wii_ai_golf/inspector/scene_camera.py'
      - 'src/wii_ai_golf/inspector/fast_texture_render.py'
      - 'scripts/p0_benchmark_private_uv_acceleration.py'
      - 'tests/test_p0_inspector_fast_render.py'
      - 'tests/test_p0_inspector_scene_camera.py'
      - 'scripts/p0_memory_inspector.py'
      - 'src/wii_ai_golf/inspector/startup.py'
      - 'tests/test_p0_memory_inspector_startup.py'
      - 'tests/test_p0_memory_inspector_visual_textures.py'
      - 'pyproject.toml'
      - '.github/workflows/p0-combined-terrain-textures-offline.yml'
  push:
    branches:
      - agent/terrain-original-textures-inspector-20261110
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional local texture preview dependencies
        run: python -m pip install Pillow numpy "numba>=0.68.1,<0.69"
      - name: UV preview PNG and strict asset source tests
        run: python -m unittest discover -s tests -p test_p0_memory_inspector_visual_textures.py -v
      - name: Direct Collada 1.5 original UV + existing TEX0 PNG tests
        run: python -m unittest discover -s tests -p test_p0_memory_inspector_dae_visual.py -v
      - name: Verify source-private UV benchmark CLI syntax
        run: python -m py_compile scripts/p0_benchmark_private_uv_acceleration.py
      - name: Native accelerated TEX0 raster identity and full-source tests
        run: python -m unittest discover -s tests -p test_p0_inspector_fast_render.py -v
      - name: Fixed-position Unity camera and integrated perspective scene tests
        run: python -m unittest discover -s tests -p test_p0_inspector_scene_camera.py -v
      - name: Full solid terrain and GUI regression tests
        run: python -m unittest discover -s tests -p test_p0_memory_inspector_terrain_solid.py -v
      - name: SHA-bound source material overlays
        run: python -m unittest discover -s tests -p test_p0_memory_inspector_terrain_labels.py -v
      - name: Preserved operator-approved startup handoff
        run: python -m unittest discover -s tests -p test_p0_memory_inspector_startup.py -v
      - name: Full repository offline regression
        run: python -m unittest discover -s tests -v

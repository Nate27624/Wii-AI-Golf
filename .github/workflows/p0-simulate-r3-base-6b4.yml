name: P0 SimulateManager r3 base for plus-0x6B4 (native-free)
on:
  push:
    paths:
      - 'scripts/review_p0_simulate_r3_6b4_source.py'
      - 'scripts/review_p0_simulate_savegpr26_source.py'
      - 'scripts/audit_p0_simulate_r3_6b4_private.py'
      - 'scripts/run_p0_simulate_r3_6b4_private.py'
      - 'tests/test_p0_simulate_r3_6b4_source.py'
      - 'tests/test_p0_simulate_savegpr26_source.py'
      - 'tests/test_p0_simulate_r3_6b4_integration.py'
      - '.github/workflows/p0-simulate-r3-base-6b4.yml'
  pull_request:
    paths:
      - 'scripts/review_p0_simulate_r3_6b4_source.py'
      - 'scripts/audit_p0_simulate_r3_6b4_private.py'
      - 'scripts/run_p0_simulate_r3_6b4_private.py'
      - 'tests/test_p0_simulate_r3_6b4_source.py'
      - 'tests/test_p0_simulate_r3_6b4_integration.py'
      - '.github/workflows/p0-simulate-r3-base-6b4.yml'
  workflow_dispatch:
jobs:
  synthetics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-only PPC r3 base and control hazard regressions
        run: python -m unittest discover -s tests -p test_p0_simulate_r3_6b4_source.py -v
      - name: Exact source GPR-save prologue and caller r3 preservation negatives
        run: python -m unittest discover -s tests -p test_p0_simulate_savegpr26_source.py -v
      - name: Original-canonical scene/source and isolated CLI regressions (fabricated)
        run: python -m unittest discover -s tests -p test_p0_simulate_r3_6b4_integration.py -v
      - name: Previously reviewed outer r4/r30 source regression
        run: python -m unittest discover -s tests -p test_p0_outer_operand_r4_r30_source.py -v

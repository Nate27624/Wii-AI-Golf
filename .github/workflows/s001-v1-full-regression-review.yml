name: S001 P0 V1 watched full Windows regression (review gate)
on:
  pull_request:
    paths:
      - 'scripts/record_selected_ball_swing_v1_private.py'
      - 'src/wii_ai_golf/integration/post_boot.py'
      - 'tests/test_s001_v1_watch_rpc_and_labels.py'
      - '.github/workflows/s001-v1-full-regression-review.yml'
  workflow_dispatch:
jobs:
  full-offline-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Source compilation
        run: python -m compileall -q src scripts tests
      - name: Complete offline unit-test discovery
        run: python -m unittest discover -s tests -v

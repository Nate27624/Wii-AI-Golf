name: S001 selected ball frame watch (synthetic only)
on:
  pull_request:
    paths:
      - "src/wii_ai_golf/integration/ball_watch_patch.py"
      - "scripts/prepare_ball_watch_bridge.py"
      - "scripts/record_selected_ball_swing_private.py"
      - "tests/test_ball_watch_patch.py"
      - "tests/test_ball_watch_report.py"
      - ".github/workflows/s001-ball-watch-synthetic.yml"
  push:
    branches:
      - agent/integration/selected-ball-frame-watch-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    name: Offline watched-bridge tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m compileall -q src/wii_ai_golf/integration/ball_watch_patch.py scripts/prepare_ball_watch_bridge.py scripts/record_selected_ball_swing_private.py tests/test_ball_watch_patch.py tests/test_ball_watch_report.py
      - run: python -m unittest discover -s tests -p "test_ball_watch_*.py" -v

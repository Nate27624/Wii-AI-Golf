name: S002 selected player untyped state word (offline synthetic)
on:
  push:
    branches:
      - agent/research/selected-player-state-word-private-20261027
  pull_request:
    paths:
      - scripts/audit_selected_player_state_word_private.py
      - tests/test_selected_player_state_word_private.py
      - .github/workflows/s002-selected-player-state-word-synthetic.yml
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q scripts/audit_selected_player_state_word_private.py tests/test_selected_player_state_word_private.py
      - run: python -m unittest discover -s tests -p test_selected_player_state_word_private.py -v
      - run: python -m unittest discover -s tests -p test_selected_ball_four_phase_private.py -v
      - run: python -m unittest discover -s tests -p test_selected_ball_start_link_private.py -v

name: S001 offline Felk startup crash triage

on:
  pull_request:
    paths:
      - 'scripts/triage_felk_startup_crash_offline.py'
      - 'tests/test_felk_startup_crash_offline.py'
      - '.github/workflows/s001-felk-startup-crash-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
    matrix:
      os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile read-only offline triage and tests
        run: python -m compileall -q scripts/triage_felk_startup_crash_offline.py tests/test_felk_startup_crash_offline.py
      - name: Run synthetic crash classification and redaction tests
        run: python -m unittest discover -s tests -p 'test_felk_startup_crash_offline.py' -v

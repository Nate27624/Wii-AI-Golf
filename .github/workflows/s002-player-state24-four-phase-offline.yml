name: S002 player member24 B0-B3 source state candidate (fake memory)
on:
  push:
    branches:
      - agent/research/player-record-state24-four-phase-source-gate
  pull_request:
    paths:
      - scripts/audit_selected_player_member24_four_phase_private.py
      - tests/test_selected_player_member24_four_phase_private.py
      - .github/workflows/s002-player-state24-four-phase-offline.yml
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile state-gated source + tests
        run: python -m py_compile scripts/audit_selected_player_member24_four_phase_private.py tests/test_selected_player_member24_four_phase_private.py
      - name: Run fake PPC and phase controls
        run: python -m unittest discover -s tests -p "test_selected_player_member24_four_phase_private.py" -v

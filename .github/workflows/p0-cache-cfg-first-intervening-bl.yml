name: P0 first intervening cache receiver BL native-free source study

on:
  push:
    branches:
      - 'agent/research/p0-cache-cfg-first-intervening-target-20261028'
  pull_request:
    paths:
      - 'scripts/audit_p0_cache_cfg_first_intervening_bl_private.py'
      - 'tests/test_p0_cache_cfg_first_intervening_bl_private.py'
      - '.github/workflows/p0-cache-cfg-first-intervening-bl.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: First intervening PPC BL source-unit synthetics (no RAM)
        run: python -B -m unittest discover -s tests -p "test_p0_cache_cfg_first_intervening_bl_private.py" -v

name: S001 Source-Backed Frame Ball Micro Watch
on:
  pull_request:
    paths:
      - 'src/wii_ai_golf/integration/selected_ball_micro_watch.py'
      - 'tests/test_selected_ball_micro_watch.py'
      - '.github/workflows/s001-ball-micro-watch-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-mock:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile read-only pure-Python sampler
        run: python -m compileall -q src/wii_ai_golf/integration/selected_ball_micro_watch.py tests/test_selected_ball_micro_watch.py
      - name: Strict synthetic memory and source tests
        run: python -m unittest discover -s tests -p test_selected_ball_micro_watch.py -v

name: V2 agent-init integration checks
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/archive/**'
      - 'docs/v2-agent-charter.md'
      - 'docs/S000-manager-playbook.md'
      - 'docs/v2-agent-continuity.md'
      - 'docs/v2-universal-prompts.md'
      - 'docs/v2-navigation.md'
      - 'scripts/agent_init.py'
      - 'scripts/agent_handoff.py'
      - 'tests/test_agent_init.py'
      - 'tests/test_agent_handoff.py'
      - 'tests/test_v2_docs_consistency.py'
      - '.github/workflows/v2-agent-init-checks.yml'
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused agent-init tests
        run: python -m unittest discover -s tests -p 'test_agent_init.py' -v
      - name: Focused agent-succession tests
        run: python -m unittest discover -s tests -p 'test_agent_handoff.py' -v
      - name: Focused V2 onboarding consistency tests
        run: python -m unittest discover -s tests -p 'test_v2_docs_consistency.py' -v
      - name: Full offline regression
        run: python -m unittest discover -s tests -v

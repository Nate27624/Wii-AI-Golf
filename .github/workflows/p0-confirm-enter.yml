name: P0 M1.5 Enter-only pre-shot confirmation
on:
  pull_request:
    paths:
      - 'scripts/collect_outcome_transition.py'
      - 'tests/test_outcome_capture_cli.py'
      - 'tests/test_m15_visual_first.py'
      - '.github/workflows/p0-confirm-enter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e .
      - name: Collector prompt and cancel regressions (no emulator)
        run: python -m unittest discover -s tests -p test_outcome_capture_cli.py -v
      - name: M1.5 exact-shot and human result regressions (no emulator)
        run: python -m unittest discover -s tests -p test_m15_visual_first.py -v
      - name: Entire offline test suite (no emulator)
        run: python -m unittest discover -s tests -v

name: S001/S002 selected ball temporal controls (offline synthetic)
on:
  push:
    branches:
      - agent/research/selected-ball-temporal-controls-s001
  pull_request:
    paths:
      - scripts/audit_selected_ball_temporal_controls_private.py
      - tests/test_selected_ball_temporal_controls_private.py
      - .github/workflows/s001-s002-ball-temporal-offline.yml
jobs:
  synthetic:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile source and tests
        run: python -m py_compile scripts/audit_selected_ball_temporal_controls_private.py tests/test_selected_ball_temporal_controls_private.py
      - name: Run fabricated private temporal evidence cases
        run: python -m unittest discover -s tests -p "test_selected_ball_temporal_controls_private.py" -v

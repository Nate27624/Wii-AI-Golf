name: S003 M2 synthetic parity gate offline

on:
  pull_request:
    paths:
      - 'src/wii_ai_golf/physics/parity_oracle.py'
      - 'tests/test_physics_parity_oracle.py'
      - 'research/studies/S003-P0-M2-PARITY-ORACLE-20261122.md'
      - '.github/workflows/s003-m2-parity-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: offline-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install full-suite dependency
        run: python -m pip install numpy
      - name: Compile offline M2 comparator and tests
        run: python -m py_compile src/wii_ai_golf/physics/parity_oracle.py tests/test_physics_parity_oracle.py
      - name: Focused M2 synthetic parity and provenance tests
        run: python -m unittest discover -s tests -p 'test_physics_parity_oracle.py' -v
      - name: Full offline regression (no Dolphin or original source)
        run: python -m unittest discover -s tests -v

name: S001 offline V1 source-compatible selected record watch
on:
  pull_request:
    paths:
      - 'src/wii_ai_golf/integration/v1_ball_watch_compat.py'
      - 'scripts/prepare_v1_selected_watch_bridge_private.py'
      - 'tests/test_s001_v1_selected_watch_compat.py'
      - '.github/workflows/s001-v1-record-watch-compat.yml'
  workflow_dispatch:
jobs:
  offline-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic V1 code preservation tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_s001_v1_selected_watch_compat.py -v
      - name: Compile
        run: python -m compileall -q src/wii_ai_golf/integration/v1_ball_watch_compat.py scripts/prepare_v1_selected_watch_bridge_private.py tests/test_s001_v1_selected_watch_compat.py
  offline-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic V1 code preservation tests
        run: |
          $env:PYTHONPATH = 'src'
          python -m unittest discover -s tests -p test_s001_v1_selected_watch_compat.py -v
      - name: Compile
        run: python -m compileall -q src/wii_ai_golf/integration/v1_ball_watch_compat.py scripts/prepare_v1_selected_watch_bridge_private.py tests/test_s001_v1_selected_watch_compat.py

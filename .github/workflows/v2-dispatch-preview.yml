name: V2 dispatch handoff and reserve safeguards

on:
  pull_request:
    paths:
      - "scripts/preview_v2_dispatch.py"
      - "tests/test_preview_v2_dispatch.py"
      - ".github/workflows/v2-dispatch-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project
        run: python -m pip install -e .
      - name: Focused V2 dispatch fail-closed tests
        run: python -m unittest discover -s tests -p "test_preview_v2_dispatch.py" -v
      - name: Full offline regression
        run: python -m unittest discover -s tests -v

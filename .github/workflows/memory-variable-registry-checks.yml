name: Memory variable registry and local JSON inventory checks

on:
  pull_request:
    paths:
      - 'research/memory-variables/**'
      - 'scripts/validate_memory_registry.py'
      - 'scripts/inventory_private_golf_json_motion.py'
      - 'scripts/triage_private_object_windows_summary.py'
      - 'scripts/contrast_p0_hit_signatures_private.py'
      - 'tests/test_memory_registry.py'
      - 'tests/test_json_motion_inventory.py'
      - 'tests/test_private_object_windows_summary.py'
      - 'tests/test_p0_hit_signatures_private.py'
      - '.github/workflows/memory-variable-registry-checks.yml'
  workflow_dispatch:

jobs:
  synthetic-only:
    name: Synthetic registry and JSON inventory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate structured memory variable registry
        run: python scripts/validate_memory_registry.py
      - name: Run source-only synthetic registry tests
        run: python -m unittest discover -s tests -p test_memory_registry.py -v
      - name: Run source-only synthetic capture inventory tests
        run: python -m unittest discover -s tests -p test_json_motion_inventory.py -v
      - name: Run S002 source-object phase summary synthetic tests
        run: python -m unittest discover -s tests -p test_private_object_windows_summary.py -v
      - name: Run private P0 cross-hit outcome contrast synthetic tests
        run: python -m unittest discover -s tests -p test_p0_hit_signatures_private.py -v

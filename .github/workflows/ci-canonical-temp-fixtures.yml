name: Full regression temporary-path / lock cross-platform
on:
  pull_request:
    paths:
      - "tests/test_lab_core.py"
      - "tests/test_golf_experiment_boot.py"
      - "tests/test_integration_controller_config.py"
      - "tests/test_integration_launcher.py"
      - "tests/test_integration_savestate_launcher.py"
      - ".github/workflows/ci-canonical-temp-fixtures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-host-regression:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install local project
        run: python -m pip install -e .
      - name: Run all offline tests, including launch locks and path handling
        run: python -m unittest discover -s tests -v

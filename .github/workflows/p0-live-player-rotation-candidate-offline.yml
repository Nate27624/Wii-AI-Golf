name: S002 P0 live player rotation source probe offline
on:
  push:
    branches:
      - agent/s002-live-player-rotation-candidate-20261110
  pull_request:
    paths:
      - 'scripts/p0_live_player_rotation_candidate_private.py'
      - 'tests/test_p0_live_player_rotation_candidate_private.py'
      - 'research/studies/P0-LIVE-PLAYER-ROTATION-CANDIDATE-20261110.md'
      - '.github/workflows/p0-live-player-rotation-candidate-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source-derived rotation and safety fixtures
        run: python -m unittest discover -s tests -p test_p0_live_player_rotation_candidate_private.py -v
      - name: Offline no-RPC selftest
        run: python scripts/p0_live_player_rotation_candidate_private.py --selftest
      - name: Syntax
        run: python -m compileall -q scripts/p0_live_player_rotation_candidate_private.py tests/test_p0_live_player_rotation_candidate_private.py
      - name: Full offline regression
        run: python -m unittest discover -s tests -v

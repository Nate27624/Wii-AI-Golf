name: S002 PRE POST shot manifest / offline contrast (synthetic)
on:
  push:
    branches:
      - agent/research/private-shot-prepost-cohort-20261027
  pull_request:
    paths:
      - scripts/audit_selected_ball_prepost_shot_private.py
      - scripts/prepare_golf_prepost_manifest_private.ps1
      - scripts/preserve_golf_paused_pair_private.ps1
      - tests/test_selected_ball_prepost_shot_private.py
      - .github/workflows/s002-shot-prepost-synthetic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    name: Private no-game shot contrast / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Source syntax
        run: python -m py_compile scripts/audit_selected_ball_prepost_shot_private.py tests/test_selected_ball_prepost_shot_private.py
      - name: Synthetic source-provenance/privacy tests ONLY
        run: python -m unittest discover -s tests -p 'test_selected_ball_prepost_shot_private.py' -v
      - name: Validate private PowerShell manifest helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/prepare_golf_prepost_manifest_private.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'Private helper did not parse' }
      - name: Check missing attestation fails before reading or writing files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $blocked = $false
          try {
            & ./scripts/prepare_golf_prepost_manifest_private.ps1 -PrivateDataRoot '.' -SessionFolder '.'
          } catch {
            $blocked = $_.Exception.Message -match 'explicit operator observation missing'
          }
          if (-not $blocked) { throw 'Attestation fail-closed gate missing' }
          if (Test-Path -LiteralPath './shot-checkpoint-manifest-PRIVATE.json') { throw 'Unexpected file written by validation' }


      - name: End-to-end manifest with synthetic zero-only banks (NO user/game data)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $data = Join-Path $env:RUNNER_TEMP 'Wii-AI-Golf-Data'
          $session = Join-Path $data 'captures/SHOT-synthetic-PRIVATE'
          New-Item -Path $session -ItemType Directory -Force | Out-Null
          foreach ($phase in @('PRE', 'POST')) {
            foreach ($bank in @('MEM1','MEM2')) {
              $size = if ($bank -eq 'MEM1') { 24MB } else { 64MB }
              $path = Join-Path $session "$phase-$bank.bin"
              $stream = [IO.File]::Open($path, [IO.FileMode]::CreateNew,
                                        [IO.FileAccess]::Write, [IO.FileShare]::None)
              try { $stream.SetLength($size) } finally { $stream.Dispose() }
            }
          }
          $out = & ./scripts/prepare_golf_prepost_manifest_private.ps1 `
            -PrivateDataRoot $data `
            -SessionFolder $session `
            -ConfirmSameDolphinProcess `
            -ConfirmExactlyOneShot `
            -ConfirmVisibleBallDisplacementBeforeReset `
            -ConfirmNoHoleResetOrTransition `
            -ConfirmBothMemBanksExportedUnderEachSamePause `
            -ConfirmGameRanBetweenPhases
          if (-not $?) { throw 'Synthetic private manifest generation failed' }
          if ($out -match '[a-fA-F0-9]{64}') { throw 'Private SHA appeared in stdout' }
          $file = Join-Path $session 'shot-checkpoint-manifest-PRIVATE.json'
          if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw 'Manifest missing' }
          $manifest = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
          if ($manifest.kind -ne 'local-private-golf-prepost-paired-checkpoints') { throw 'Wrong kind' }
          foreach ($phase in @('PRE','POST')) {
            foreach ($bank in @('MEM1','MEM2')) {
              $actual = (Get-FileHash -LiteralPath (Join-Path $session "$phase-$bank.bin") -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($manifest.checkpoints.$phase.sha256.$bank -cne $actual) { throw 'Hash disagreement' }
            }
          }
          $script = "import sys;from pathlib import Path;sys.path.insert(0,'scripts');import audit_selected_ball_prepost_shot_private as a;a._manifest(Path(sys.argv[1]));print('Synthetic manifest accepted by Python checker')"
          python -c $script $session
          if ($LASTEXITCODE -ne 0) { throw 'Python typed manifest validation failed' }

      - name: Parse PRE/POST pausing preservation PowerShell
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/preserve_golf_paused_pair_private.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'Paired bank staging parser failure' }
      - name: Preserve PRE and POST synthetic paused native exports with overwrite and stale guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $run = Join-Path $env:RUNNER_TEMP 'private-paired-stage-test'
          $clean = Join-Path $run 'tools/FelkDolphin-Clean/User'
          $dump = Join-Path $clean 'Dump'
          $data = Join-Path $run 'Wii-AI-Golf-Data'
          $session = Join-Path $data 'captures/SHOT-synthetic-stage-PRIVATE'
          New-Item -Path $dump -ItemType Directory -Force | Out-Null
          New-Item -Path $session -ItemType Directory -Force | Out-Null
          $mem1 = Join-Path $dump 'mem1.raw'
          $mem2 = Join-Path $dump 'mem2.raw'
          foreach ($b in @(@{ Path = $mem1; Size = 24MB }, @{ Path = $mem2; Size = 64MB })) {
            $f = [IO.File]::Open($b.Path, [IO.FileMode]::CreateNew,
                                 [IO.FileAccess]::Write, [IO.FileShare]::None)
            try { $f.SetLength($b.Size) } finally { $f.Dispose() }
          }
          $args = @{
            CleanDolphinUserRoot = $clean
            SourceMem1Path = $mem1
            SourceMem2Path = $mem2
            PrivateDataRoot = $data
            SessionFolder = $session
            ExportStartedAfter = [datetime]::Now.AddMinutes(-5)
            ConfirmBothExportsUnderSameGuiPause = $true
            ConfirmCorrectVisibleShotPhase = $true
            ConfirmNoHoleOrDolphinProcessChange = $true
          }
          $out1 = & ./scripts/preserve_golf_paused_pair_private.ps1 @args -Phase PRE
          if (-not $?) { throw 'PRE staging failed' }
          $out2 = & ./scripts/preserve_golf_paused_pair_private.ps1 @args -Phase POST
          if (-not $?) { throw 'POST staging failed' }
          foreach ($phase in @('PRE','POST')) {
            foreach ($bank in @('MEM1','MEM2')) {
              $source = if ($bank -eq 'MEM1') { $mem1 } else { $mem2 }
              $saved = Join-Path $session "$phase-$bank.bin"
              if (-not (Test-Path -LiteralPath $saved -PathType Leaf)) { throw 'Missing stage' }
              if ((Get-FileHash -LiteralPath $saved -Algorithm SHA256).Hash -cne
                  (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash) {
                throw 'Source-vs-stage hash mismatch'
              }
            }
          }
          if (($out1 + $out2) -match '(?i)[0-9a-f]{64}|mem1.raw|mem2.raw') {
            throw 'Unexpected private input name/hash in stdout'
          }
          $blocked = $false
          try {
            & ./scripts/preserve_golf_paused_pair_private.ps1 @args -Phase PRE
          } catch { $blocked = $true }
          if (-not $blocked) { throw 'PRE overwrite not rejected' }
          $bad = $args.Clone()
          $bad.ExportStartedAfter = [datetime]::Now.AddMinutes(1)
          $fresh = Join-Path $data 'captures/SHOT-synthetic-stale-PRIVATE'
          New-Item -Path $fresh -ItemType Directory -Force | Out-Null
          $bad.SessionFolder = $fresh
          $blocked = $false
          try {
            & ./scripts/preserve_golf_paused_pair_private.ps1 @bad -Phase PRE
          } catch { $blocked = $true }
          if (-not $blocked) { throw 'Stale source export not rejected' }
          Write-Output 'Synthetic paired native staging passes on clean portable root.'

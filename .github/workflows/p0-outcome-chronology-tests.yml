name: P0 outcome RAM chronology guards (synthetic only)

on:
  pull_request:
    paths:
      - 'src/wii_ai_golf/audit/outcome_transition.py'
      - 'tests/test_outcome_transition.py'
      - 'tests/test_outcome_capture_cli.py'
      - '.github/workflows/p0-outcome-chronology-tests.yml'
  workflow_dispatch:

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Outcome source, frame and phase tests (NO Dolphin)
        run: python -m unittest discover -s tests -p test_outcome_transition.py -v
      - name: Existing collector synthetic tests (NO Dolphin)
        run: python -m unittest discover -s tests -p test_outcome_capture_cli.py -v
      - name: Offline outcome recovery integration tests (NO Dolphin)
        run: python -m unittest discover -s tests -p test_outcome_recovery.py -v
      # Main has an unrelated Lab lock-message assertion mismatch on Linux.
      # Keep whole-repo results visible without pretending that pre-existing
      # cross-platform Lab test is a new outcome-chronology regression.
      - name: Full repository regression audit (advisory, NO Dolphin)
        continue-on-error: true
        run: python -m unittest discover -s tests -p 'test_*.py' -v

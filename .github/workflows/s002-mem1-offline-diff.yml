name: S002 whole-MEM1 offline differential validation
on:
  pull_request:
    paths:
      - 'src/wii_ai_golf/audit/mem1_checkpoint_diff.py'
      - 'scripts/analyze_mem1_checkpoints.py'
      - 'tests/test_mem1_checkpoint_diff.py'
      - 'src/wii_ai_golf/audit/golf_cross_bank_state.py'
      - 'scripts/audit_golf_cross_bank_private.py'
      - 'tests/test_audit_golf_cross_bank_state.py'
      - '.github/workflows/s002-mem1-offline-diff.yml'
  workflow_dispatch:
jobs:
  offline-targeted:
    name: MEM1 offline synthetic tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify syntax
        run: python -m compileall -q src scripts tests
      - name: Test private MEM1 page differ and safety
        run: python -m unittest discover -s tests -p 'test_mem1_checkpoint_diff.py' -v
      - name: Test source-gated paired MEM1/MEM2 object graph
        run: python -m unittest discover -s tests -p 'test_audit_golf_cross_bank_state.py' -v
      - name: Full repository regression (known shared S000 lock assertion may fail)
        run: python -m unittest discover -s tests -v

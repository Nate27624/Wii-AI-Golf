name: P0 atomic A45 bridge callback and visual-first integration
on:
  pull_request:
    paths:
      - 'src/wii_ai_golf/integration/atomic_a45_patch.py'
      - 'src/wii_ai_golf/integration/atomic_a45_client.py'
      - 'src/wii_ai_golf/shared/bridge_provenance.py'
      - 'scripts/prepare_atomic_a45_bridge.py'
      - 'scripts/collect_outcome_transition.py'
      - 'scripts/research_cli.py'
      - 'tests/test_atomic_a45_bridge.py'
      - 'tests/test_m15_visual_first.py'
      - '.github/workflows/p0-atomic-a45.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Synthetic actual generated bridge callback and client tests
        run: python -m unittest discover -s tests -p test_atomic_a45_bridge.py -v
      - name: Human visual-first and control no-contact tests
        run: python -m unittest discover -s tests -p test_m15_visual_first.py -v
      - name: Entire offline regression suite
        run: python -m unittest discover -s tests -v

name: S003 CCD first-entry precision oracle (offline)

on:
  pull_request:
    paths:
      - 'scripts/research_p0_ccd_precision_oracle_v2.py'
      - 'tests/test_physics_ccd_precision_oracle_v2.py'
      - 'research/studies/S003-P0-CCD-PRECISION-ORACLE-20261122.md'
      - '.github/workflows/s003-ccd-precision-oracle-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decimal-oracle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install full-suite dependency
        run: python -m pip install numpy
      - name: Focused synthetic Decimal and production-observation tests
        run: python -m unittest discover -s tests -p 'test_physics_ccd_precision_oracle_v2.py' -v
      - name: Bounded observation of current production solver (not a native parity claim)
        run: python scripts/research_p0_ccd_precision_oracle_v2.py --summary --compare-existing
      - name: Full offline regression
        run: python -m unittest discover -s tests -v
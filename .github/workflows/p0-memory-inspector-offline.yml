name: P0 offline memory inspector synthetic tests
on:
  pull_request:
    paths:
      - 'src/wii_ai_golf/inspector/**'
      - 'scripts/p0_memory_inspector.py'
      - 'tests/test_p0_memory_inspector*.py'
      - '.github/workflows/p0-memory-inspector-offline.yml'
  push:
    paths:
      - 'src/wii_ai_golf/inspector/**'
      - 'scripts/p0_memory_inspector.py'
      - 'tests/test_p0_memory_inspector*.py'
      - '.github/workflows/p0-memory-inspector-offline.yml'
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused synthetic replay checks
        run: python -m unittest discover -s tests -p test_p0_memory_inspector.py -v
      - name: Focused synthetic live worker checks
        run: python -m unittest discover -s tests -p test_p0_memory_inspector_live.py -v
      - name: Focused synthetic A-button candidate checks
        run: python -m unittest discover -s tests -p test_p0_memory_inspector_a_button.py -v
      - name: Focused passive A reference checks
        run: python -m unittest discover -s tests -p test_p0_memory_inspector_a_reference.py -v
      - name: Focused batched source parity and speed checks
        run: python -m unittest discover -s tests -p test_p0_memory_inspector_fast.py -v
      - name: Auto A candidate regressions
        run: python -m unittest discover -s tests -p test_p0_memory_inspector_a_live.py -v
      - name: Focused private collision terrain OBJ checks
        run: python -m unittest discover -s tests -p test_p0_memory_inspector_terrain.py -v
      - name: Full offline regression suite
        run: python -m unittest discover -s tests -v

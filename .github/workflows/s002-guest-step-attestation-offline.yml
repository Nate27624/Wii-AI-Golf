name: S002 guest-step attestation offline

on:
  pull_request:
    paths:
      - 'scripts/review_p0_guest_step_attestation.py'
      - 'tests/test_p0_guest_step_attestation.py'
      - 'research/studies/S002-P0-GUEST-STEP-ATTESTATION-20261121.md'
      - '.github/workflows/s002-guest-step-attestation-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: offline-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install full-suite dependency
        run: python -m pip install numpy
      - name: Compile offline guest-step validator
        run: python -m py_compile scripts/review_p0_guest_step_attestation.py tests/test_p0_guest_step_attestation.py
      - name: Focused guest-step provenance and privacy tests
        run: python -m unittest discover -s tests -p 'test_p0_guest_step_attestation.py' -v
      - name: Full offline regression (no Dolphin or original source)
        run: python -m unittest discover -s tests -v

name: S002 static MEM2 pin cup selected ball spatial coherence
on:
  push:
    branches:
      - agent/research/selected-pin-cup-start-ball-geometry
  pull_request:
    paths:
      - scripts/audit_golf_spatial_alignment_private.py
      - tests/test_golf_spatial_alignment_private.py
      - .github/workflows/s002-spatial-alignment-offline.yml
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile source and fabricated cases
        run: python -m py_compile scripts/audit_golf_spatial_alignment_private.py tests/test_golf_spatial_alignment_private.py
      - name: Source gated synthetic MEM2 spatial comparisons
        run: python -m unittest discover -s tests -p "test_golf_spatial_alignment_private.py" -v

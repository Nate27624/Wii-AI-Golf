name: P0 club selector static source audit
on:
  push:
    branches:
      - agent/p0-club-source-selector-triage-20261030
  pull_request:
    paths:
      - 'scripts/audit_p0_club_selection_code_private.py'
      - 'tests/test_p0_club_selection_code_private.py'
      - 'research/studies/P0-CLUB-SELECTOR-SOURCE-TRIAGE-01.md'
      - '.github/workflows/p0-club-selector-static-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic focused source triage
        run: python -m unittest discover -s tests -p test_p0_club_selection_code_private.py -v
      - name: Full offline regression
        run: python -m unittest discover -s tests -v
      - name: Script selftest
        run: python scripts/audit_p0_club_selection_code_private.py --selftest
      - name: Syntax check
        run: python -m compileall -q scripts/audit_p0_club_selection_code_private.py tests/test_p0_club_selection_code_private.py

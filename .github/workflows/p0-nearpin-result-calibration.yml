name: P0 NearPin result score vs distance calibration gate

on:
  pull_request:
    paths:
      - "scripts/audit_golf_shot_cup_distance_private.py"
      - "tests/test_golf_shot_cup_distance_private.py"
      - "research/studies/S002-SHOT-CUP-DISTANCE-01.md"
      - ".github/workflows/p0-nearpin-result-calibration.yml"
  push:
    paths:
      - "scripts/audit_golf_shot_cup_distance_private.py"
      - "tests/test_golf_shot_cup_distance_private.py"
      - ".github/workflows/p0-nearpin-result-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nearpin-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile shot-distance reader and fabricated tests
        run: python -m compileall -q scripts/audit_golf_shot_cup_distance_private.py tests/test_golf_shot_cup_distance_private.py
      - name: Run fabricated PRE POST RESULT penalty and calibration guards
        run: python -m unittest discover -s tests -p "test_golf_shot_cup_distance_private.py" -v

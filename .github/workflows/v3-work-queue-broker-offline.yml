name: V3 Work Queue broker offline
on:
  pull_request:
    paths:
      - 'src/wii_ai_golf/orchestration/**'
      - 'tests/test_v3_work_queue_broker.py'
      - 'tests/test_v3_artifact_gateway.py'
      - 'docs/v3-work-queue-broker.md'
      - '.github/workflows/v3-work-queue-broker-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m py_compile src/wii_ai_golf/orchestration/broker.py src/wii_ai_golf/orchestration/artifact_gateway.py tests/test_v3_work_queue_broker.py tests/test_v3_artifact_gateway.py
      - run: python -m unittest discover -s tests -p 'test_v3_work_queue_broker.py' -v
      - run: python -m unittest discover -s tests -p 'test_v3_artifact_gateway.py' -v
      - run: python -m unittest discover -s tests -v

name: P0 private Wii Golf visual asset discovery offline

on:
  pull_request:
    paths:
      - 'scripts/p0_private_visual_asset_discovery.py'
      - 'tests/test_p0_private_visual_asset_discovery.py'
      - 'docs/p0-private-visual-asset-extraction-checklist.md'
      - '.github/workflows/p0-private-visual-assets-offline.yml'
  push:
    branches:
      - agent/p0-private-visual-assets-discovery-20261110
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic source visual discovery tests
        run: python -m unittest discover -s tests -p test_p0_private_visual_asset_discovery.py -v
      - name: Validate existing strict UV model loader with optional deps
        run: |
          python -m pip install Pillow numpy
          python -m unittest discover -s tests -p test_p0_memory_inspector_visual_textures.py -v
      - name: Full repository offline suite
        run: python -m unittest discover -s tests -v

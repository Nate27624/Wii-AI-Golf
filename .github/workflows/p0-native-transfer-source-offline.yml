name: P0 native wind and KCol source probe safety
on:
  pull_request:
    paths:
      - 'scripts/research_p0_native_transfer_sources_private.py'
      - 'scripts/research_p0_native_wind_transfer_private.py'
      - 'scripts/research_p0_native_impact_damping_private.py'
      - 'scripts/research_p0_native_normalizer_guards_private.py'
      - 'scripts/research_p0_native_kcol_response_private.py'
      - 'tests/test_native_transfer_source_studies.py'
      - 'tests/test_p0_native_normalizer_guards.py'
      - '.github/workflows/p0-native-transfer-source-offline.yml'
  push:
    branches:
      - 'agent/operator-physics-transfer-probes-20261113'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: python -m py_compile scripts/research_p0_native_transfer_sources_private.py scripts/research_p0_native_wind_transfer_private.py scripts/research_p0_native_impact_damping_private.py scripts/research_p0_native_kcol_response_private.py scripts/research_p0_native_normalizer_guards_private.py tests/test_native_transfer_source_studies.py tests/test_p0_native_normalizer_guards.py
      - name: Focused synthetic positive and negative controls
        run: python -I -m unittest discover -s tests -p test_native_transfer_source_studies.py -v
      - name: Focused native lift and side guard controls
        run: python -I -m unittest discover -s tests -p test_p0_native_normalizer_guards.py -v
      - name: Install existing offline test dependency
        run: python -m pip install numpy
      - name: Full offline regression
        run: python -m unittest discover -s tests -v

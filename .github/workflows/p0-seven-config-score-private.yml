name: P0 seven source config-score offline
on:
  push:
    paths:
      - 'scripts/audit_p0_seven_config_score_private.py'
      - 'scripts/audit_p0_golf_config_score_index_ppc_private.py'
      - 'scripts/audit_p0_golf_config_getter_suffix_private.py'
      - 'scripts/Invoke-P0GolfConfigScoreIndexSource.ps1'
      - 'tests/test_p0_seven_config_score_private.py'
      - 'tests/test_p0_golf_config_score_index_ppc_private.py'
      - 'tests/test_p0_golf_config_getter_suffix_private.py'
      - '.github/workflows/p0-seven-config-score-private.yml'
  pull_request:
    paths:
      - 'scripts/audit_p0_seven_config_score_private.py'
      - 'scripts/audit_p0_golf_config_score_index_ppc_private.py'
      - 'scripts/audit_p0_golf_config_getter_suffix_private.py'
      - 'scripts/Invoke-P0GolfConfigScoreIndexSource.ps1'
      - 'tests/test_p0_seven_config_score_private.py'
      - 'tests/test_p0_golf_config_score_index_ppc_private.py'
      - 'tests/test_p0_golf_config_getter_suffix_private.py'
      - '.github/workflows/p0-seven-config-score-private.yml'
  workflow_dispatch:
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic-only source/score and privacy tests
        run: python -m unittest discover -s tests -p test_p0_seven_config_score_private.py -v

      - name: Source-only PPC index conflict regression controls
        run: python -m unittest discover -s tests -p test_p0_golf_config_score_index_ppc_private.py -v
      - name: PowerShell 5.1 syntax check for pinned offline original archive audit
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/Invoke-P0GolfConfigScoreIndexSource.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('PowerShell syntax validation failed: ' + $errors.Count) }

      - name: Test getter suffix arithmetic
        run: python -m unittest discover -s tests -p test_p0_golf_config_getter_suffix_private.py -v

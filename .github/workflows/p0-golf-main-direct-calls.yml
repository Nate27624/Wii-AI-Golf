name: P0 Golf main bounded source call inventory
on:
  push:
    paths:
      - scripts/review_p0_golf_main_update_direct_calls.py
      - scripts/review_p0_three_sim_callee_footprints.py
      - tests/test_p0_three_sim_callee_footprints.py
      - scripts/audit_p0_golf_oncalculate_dispatch_private.py
      - tests/test_p0_golf_main_update_direct_calls.py
      - .github/workflows/p0-golf-main-direct-calls.yml
  pull_request:
    paths:
      - scripts/review_p0_golf_main_update_direct_calls.py
      - scripts/review_p0_three_sim_callee_footprints.py
      - tests/test_p0_three_sim_callee_footprints.py
      - scripts/audit_p0_golf_oncalculate_dispatch_private.py
      - tests/test_p0_golf_main_update_direct_calls.py
      - .github/workflows/p0-golf-main-direct-calls.yml
  workflow_dispatch:

jobs:
  source-call-synthetics:
    name: ${{ matrix.os }} Golf main 101 source words
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: New bounded Golf main call/branch syntax synthetic tests
        run: python -I -B -m unittest discover -s tests -p test_p0_golf_main_update_direct_calls.py -v
      - name: Three exact SimulateManager callee footprints and call-gap synthetics
        run: python -I -B -m unittest discover -s tests -p test_p0_three_sim_callee_footprints.py -v
      - name: Inherited Rev1 OnCalculate 2-word source and privacy tests
        run: python -I -B -m unittest discover -s tests -p test_p0_golf_oncalculate_dispatch_private.py -v

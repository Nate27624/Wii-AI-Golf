name: P0 Wii Golf Tree Hitbox Source Audit Offline
on:
  push:
    branches:
      - agent/p0-tree-hitbox-source-audit-20261030
  pull_request:
    paths:
      - scripts/p0_tree_hitbox_source_callgraph_private.py
      - tests/test_p0_tree_hitbox_source_callgraph_private.py
      - scripts/p0_tree_hitbox_five_calls_private.py
      - tests/test_p0_tree_hitbox_five_calls_private.py
      - scripts/p0_ball_kcol_twelve_calls_private.py
      - tests/test_p0_ball_kcol_twelve_calls_private.py
      - scripts/p0_ball_kcol_postcall_context_private.py
      - tests/test_p0_ball_kcol_postcall_context_private.py
      - scripts/p0_ball_kcol_material_branch_private.py
      - scripts/p0_ball_kcol_result_provenance_private.py
      - scripts/p0_ball_kcol_prism_type_origin_private.py
      - scripts/p0_ball_kcol_active_resource_private.py
      - scripts/p0_ball_kcol_prism_dummy_layout_private.py
      - scripts/p0_ball_kcol_seven_capture_active_kcl_private.py
      - scripts/p0_tree_ball_indirect_dispatch_private.py
      - scripts/p0_tree_ball_runtime_table_alias_private.py
      - scripts/p0_tree_full_public_table_targets_private.py
      - scripts/p0_tree_contact_record_private.py
      - scripts/run_p0_tree_contact_record.ps1
      - tests/test_p0_tree_contact_record_private.py
      - tests/test_p0_tree_full_public_table_targets_private.py
      - tests/test_p0_tree_ball_runtime_table_alias_private.py
      - tests/test_p0_tree_ball_indirect_dispatch_private.py
      - tests/test_p0_ball_kcol_seven_capture_active_kcl_private.py
      - tests/test_p0_ball_kcol_prism_dummy_layout_private.py
      - tests/test_p0_ball_kcol_active_resource_private.py
      - tests/test_p0_ball_kcol_prism_type_origin_private.py
      - tests/test_p0_ball_kcol_result_provenance_private.py
      - tests/test_p0_ball_kcol_material_branch_private.py
      - scripts/p0_golf_kcol_collision_windows_private.py
      - tests/test_p0_golf_kcol_collision_windows_private.py
      - scripts/p0_tree_hitbox_object_dispatch_private.py
      - tests/test_p0_tree_hitbox_object_dispatch_private.py
      - scripts/p0_tree_ball_84byte_context_private.py
      - tests/test_p0_tree_ball_84byte_context_private.py
      - scripts/p0_tree_proximity_flag_private.py
      - tests/test_p0_tree_proximity_flag_private.py
      - scripts/p0_tree_flag_consumer_trace_private.py
      - tests/test_p0_tree_flag_consumer_trace_private.py
      - scripts/p0_tree_flag_receiver_disambiguation_private.py
      - tests/test_p0_tree_flag_receiver_disambiguation_private.py
      - scripts/p0_fieldmanager_tree_caller_receivers_private.py
      - tests/test_p0_fieldmanager_tree_caller_receivers_private.py
      - scripts/p0_tree_second_loop_geometry_private.py
      - tests/test_p0_tree_second_loop_geometry_private.py
      - scripts/p0_tree_kcl_spatial_broadphase_private.py
      - tests/test_p0_tree_kcl_spatial_broadphase_private.py
      - scripts/p0_tree_kcl_frame_diagnostics_private.py
      - tests/test_p0_tree_kcl_frame_diagnostics_private.py
      - scripts/p0_tree_kcl_exact_triangle_distance_private.py
      - tests/test_p0_tree_kcl_exact_triangle_distance_private.py
      - scripts/p0_tree_kcl_surface_group_join_private.py
      - tests/test_p0_tree_kcl_surface_group_join_private.py
      - research/studies/P0-GOLF-TREE-HITBOX-01.md
      - .github/workflows/p0-tree-hitbox-source-offline.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused native PPC source callgraph and static falsification
        run: python -m unittest discover -s tests -p test_p0_tree_hitbox_source_callgraph_private.py -v
      - name: Focused five original Tree callsites and target decode bounds
        run: python -m unittest discover -s tests -p test_p0_tree_hitbox_five_calls_private.py -v
      - name: Focused Ball to GolfKCol real source calls, no false tree physics
        run: python -m unittest discover -s tests -p test_p0_ball_kcol_twelve_calls_private.py -v
      - name: Focused source-bound KCL query and narrowphase five code windows
        run: python -m unittest discover -s tests -p test_p0_golf_kcol_collision_windows_private.py -v
      - name: Source-verified tree object dispatch/inline collider cues
        run: python -m unittest discover -s tests -p test_p0_tree_hitbox_object_dispatch_private.py -v
      - name: Tree and Ball 84-byte inline access source code windows
        run: python -m unittest discover -s tests -p test_p0_tree_ball_84byte_context_private.py -v
      - name: Source PSVECSquareDistance tree flag and 94-position scaling tests
        run: python -m unittest discover -s tests -p test_p0_tree_proximity_flag_private.py -v
      - name: Source-verified tree distance flag consumer context
        run: python -m unittest discover -s tests -p test_p0_tree_flag_consumer_trace_private.py -v
      - name: P0 tree +0x48 receiver identity vs native camera calls
        run: python -m unittest discover -s tests -p test_p0_tree_flag_receiver_disambiguation_private.py -v
      - name: Source-authenticated FieldManager true-tree vs other reader caller
        run: python -m unittest discover -s tests -p test_p0_fieldmanager_tree_caller_receivers_private.py -v
      - name: Source 94-tree second loop and camera geometry receiver
        run: python -m unittest discover -s tests -p test_p0_tree_second_loop_geometry_private.py -v
      - name: Original KCL prism reconstruction versus 94 source tree spatial bins
        run: python -m unittest discover -s tests -p test_p0_tree_kcl_spatial_broadphase_private.py -v
      - name: KCL world-frame tee-pin controls and full unfiltered near-face diagnostics
        run: python -m unittest discover -s tests -p test_p0_tree_kcl_frame_diagnostics_private.py -v
      - name: Original exact triangle distance vs 94 trees and tee pin positive controls
        run: python -m unittest discover -s tests -p test_p0_tree_kcl_exact_triangle_distance_private.py -v
      - name: Native 72-22 resource group versus per-tree rough OOB surface join
        run: python -m unittest discover -s tests -p test_p0_tree_kcl_surface_group_join_private.py -v
      - name: P0 source five Ball-KCol return branch and velocity-store triage
        run: python -m unittest discover -s tests -p test_p0_ball_kcol_postcall_context_private.py -v
      - name: Native Ball KCL material 7 12 13 return and ball member float triad source
        run: python -m unittest discover -s tests -p test_p0_ball_kcol_material_branch_private.py -v
      - name: Native KCL classification-producer and Ball field consumer strict evidence audit
        run: python -m unittest discover -s tests -p test_p0_ball_kcol_result_provenance_private.py -v
      - name: Native KCL prism type-to-result and Ball state-copy provenance audit
        run: python -m unittest discover -s tests -p test_p0_ball_kcol_prism_type_origin_private.py -v
      - name: Source-qualified Ball KCol global resource and true terrain KCL identity
        run: python -m unittest discover -s tests -p test_p0_ball_kcol_active_resource_private.py -v
      - name: Active Ball KCL prism table 16-byte dummy-base versus usable-prism alignment
        run: python -m unittest discover -s tests -p test_p0_ball_kcol_prism_dummy_layout_private.py -v
      - name: Seven capture active KCL resource and class13 native material audit
        run: python -m unittest discover -s tests -p test_p0_ball_kcol_seven_capture_active_kcl_private.py -v
      - name: Original Ball tree firstword table and indirect dispatch strict evidence gate
        run: python -m unittest discover -s tests -p test_p0_tree_ball_indirect_dispatch_private.py -v
      - name: Source-gated 94-tree table versus Ball child dispatch receiver memory identity
        run: python -m unittest discover -s tests -p test_p0_tree_ball_runtime_table_alias_private.py -v
      - name: Exact Tree shared-table 64 slots versus complete public Rev1 text map
        run: python -m unittest discover -s tests -p test_p0_tree_full_public_table_targets_private.py -v
      - name: Synthetic operator wood foliage and near-miss read-only recorder
        run: python -m unittest discover -s tests -p test_p0_tree_contact_record_private.py -v
      - name: Full offline regression
        run: python -m unittest discover -s tests -v

name: S002 original math helper offline tests

on:
  pull_request:
    paths:
      - 'scripts/research_p0_math_helpers_private.py'
      - 'scripts/research_p0_math_helper_boundary_ideal.py'
      - 'tests/test_research_p0_math_helpers_private.py'
      - 'tests/test_research_p0_math_helper_boundary_ideal.py'
      - '.github/workflows/ci-s002-math-helper-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math-helper-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install full-suite dependency
        run: python -m pip install numpy
      - name: Focused source decoder synthetic tests
        run: python -m unittest discover -s tests -p 'test_research_p0_math_helpers_private.py' -v
      - name: Focused idealized boundary synthetic tests
        run: python -m unittest discover -s tests -p 'test_research_p0_math_helper_boundary_ideal.py' -v
      - name: Full offline regression
        run: python -m unittest discover -s tests -v

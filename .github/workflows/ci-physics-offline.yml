name: Physics simulator offline regression

on:
  pull_request:
    paths:
      - 'src/wii_ai_golf/physics/**'
      - 'tests/test_first_contact_solver.py'
      - 'tests/test_airborne_integrator.py'
      - 'tests/test_terrain_lie.py'
      - 'tests/test_physics_*.py'
      - 'research/studies/S003-P0-FIRST-CONTACT-SOLVER-01.md'
      - '.github/workflows/ci-physics-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install full-suite dependency
        run: python -m pip install numpy
      - name: Run focused first-contact tests when present
        shell: bash
        run: |
          if [ -f tests/test_first_contact_solver.py ]; then
            python -m unittest discover -s tests -p 'test_first_contact_solver.py' -v
          else
            echo "No first-contact tests in this head yet."
          fi
      - name: Run focused airborne and terrain tests when present
        shell: bash
        run: |
          for suite in test_airborne_integrator.py test_terrain_lie.py; do
            if [ -f "tests/$suite" ]; then
              python -m unittest discover -s tests -p "$suite" -v
            fi
          done
      - name: Full offline regression
        run: python -m unittest discover -s tests -v

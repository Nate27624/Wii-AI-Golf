name: S002 P0 Golf result UI source xref synthetic

on:
  push:
    paths:
      - 'scripts/audit_p0_golf_result_ui_xrefs_private.py'
      - 'tests/test_p0_golf_result_ui_xrefs_private.py'
      - 'scripts/audit_p0_golf_sprintf_arg_origins_private.py'
      - 'tests/test_p0_golf_sprintf_arg_origins_private.py'
      - 'scripts/audit_p0_golf_sprintf_r31_variadics_private.py'
      - 'tests/test_p0_golf_sprintf_r31_variadics_private.py'
      - 'scripts/audit_p0_golf_sprintf_format_types_private.py'
      - 'tests/test_p0_golf_sprintf_format_types_private.py'
      - '.github/workflows/p0-golf-result-ui-xrefs.yml'
  pull_request:
    paths:
      - 'scripts/audit_p0_golf_result_ui_xrefs_private.py'
      - 'tests/test_p0_golf_result_ui_xrefs_private.py'
      - 'scripts/audit_p0_golf_sprintf_arg_origins_private.py'
      - 'tests/test_p0_golf_sprintf_arg_origins_private.py'
      - 'scripts/audit_p0_golf_sprintf_r31_variadics_private.py'
      - 'tests/test_p0_golf_sprintf_r31_variadics_private.py'
      - 'scripts/audit_p0_golf_sprintf_format_types_private.py'
      - 'tests/test_p0_golf_sprintf_format_types_private.py'
      - '.github/workflows/p0-golf-result-ui-xrefs.yml'
  workflow_dispatch:

jobs:
  source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run fabricated PPC direct/indirect xref tests
        run: |
          python -m unittest discover -s tests -p 'test_p0_golf_result_ui_xrefs_private.py' -v
          python -m unittest discover -s tests -p 'test_p0_golf_sprintf_arg_origins_private.py' -v
          python -m unittest discover -s tests -p 'test_p0_golf_sprintf_r31_variadics_private.py' -v
          python -m unittest discover -s tests -p 'test_p0_golf_sprintf_format_types_private.py' -v

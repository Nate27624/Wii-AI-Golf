name: S002 source-global ball ctor return candidate

on:
  push:
    paths:
      - 'scripts/review_p0_ball_constructor_return.py'
      - 'tests/test_p0_ball_constructor_return_private.py'
      - 'scripts/audit_p0_global_ball_source_xrefs_private.py'
      - '.github/workflows/p0-global-ball-ctor-return.yml'
  pull_request:
    paths:
      - 'scripts/review_p0_ball_constructor_return.py'
      - 'tests/test_p0_ball_constructor_return_private.py'
      - 'scripts/audit_p0_global_ball_source_xrefs_private.py'
      - '.github/workflows/p0-global-ball-ctor-return.yml'
  workflow_dispatch:

jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fake PPC constructor return candidate tests
        run: python -m unittest discover -s tests -p 'test_p0_ball_constructor_return_private.py' -v
      - name: Public symbol BO/BI and allocator-null regression tests
        run: python -m unittest discover -s tests -p 'test_p0_global_slot_symbol_nullguard_private.py' -v

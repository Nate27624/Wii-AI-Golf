name: P0 LocalOps v2 public contract (offline)

on:
  pull_request:
    paths:
      - 'scripts/local_ops/contract_v2.py'
      - 'tests/test_p0_localops_v2_contract.py'
      - 'docs/v2-localops-agent-guide.md'
      - 'docs/v2-navigation.md'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/workflows/p0-localops-v2-consumer-offline.yml'
  push:
    paths:
      - 'scripts/local_ops/contract_v2.py'
      - 'tests/test_p0_localops_v2_contract.py'
      - '.github/workflows/p0-localops-v2-consumer-offline.yml'

permissions:
  contents: read

jobs:
  offline:
    name: contract and full offline suite / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing visual test dependencies
        run: python -m pip install -e ".[visual]"
      - name: Compile public contract
        run: python -m py_compile scripts/local_ops/contract_v2.py tests/test_p0_localops_v2_contract.py
      - name: Validate request and result semantics (no GitHub or PC calls)
        run: python -m unittest discover -s tests -p "test_p0_localops_v2_contract.py" -v
      - name: Full Wii Golf offline regression suite
        run: python -m unittest discover -s tests -v

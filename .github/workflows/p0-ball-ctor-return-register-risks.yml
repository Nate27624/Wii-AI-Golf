name: S002 global ball ctor return register risk source

on:
  push:
    paths:
      - 'scripts/review_p0_ball_ctor_return_register_risks.py'
      - 'tests/test_p0_ball_ctor_return_register_risks.py'
      - 'scripts/audit_p0_global_ball_source_xrefs_private.py'
      - '.github/workflows/p0-ball-ctor-return-register-risks.yml'
  pull_request:
    paths:
      - 'scripts/review_p0_ball_ctor_return_register_risks.py'
      - 'tests/test_p0_ball_ctor_return_register_risks.py'
      - 'scripts/audit_p0_global_ball_source_xrefs_private.py'
      - '.github/workflows/p0-ball-ctor-return-register-risks.yml'
  workflow_dispatch:

jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test constructor source register writes and return bypass
        run: python -m unittest discover -s tests -p 'test_p0_ball_ctor_return_register_risks.py' -v
      - name: Test existing constructor source receiver-return classification
        run: python -m unittest discover -s tests -p 'test_p0_ball_constructor_return_private.py' -v

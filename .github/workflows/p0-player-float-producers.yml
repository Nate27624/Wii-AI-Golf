name: P0 six player FPR source-site producer clues
on:
  pull_request:
    paths:
      - 'scripts/audit_p0_player_float_local_producers_private.py'
      - 'tests/test_p0_player_float_local_producers_private.py'
      - '.github/workflows/p0-player-float-producers.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile both new source and synthetic tests
        run: python -m compileall -q scripts/audit_p0_player_float_local_producers_private.py tests/test_p0_player_float_local_producers_private.py
      - name: Fabricated PowerPC six-store sources
        run: python -m unittest discover -s tests -p test_p0_player_float_local_producers_private.py -v

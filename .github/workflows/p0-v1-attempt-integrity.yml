name: P0 V1 child outcome + parent publication integrity (synthetic)
on:
  pull_request:
    paths:
      - "scripts/collect_outcome_transition.py"
      - "scripts/research_cli.py"
      - "tests/test_outcome_capture_cli.py"
      - "tests/test_research_cli.py"
      - ".github/workflows/p0-v1-attempt-integrity.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthetic-only collector cancellation and human-result tests
        run: python -m unittest discover -s tests -p test_outcome_capture_cli.py -v
      - name: Synthetic-only parent publication and identity tests
        run: python -m unittest discover -s tests -p test_research_cli.py -v
      - name: Synthetic-only clean-launch regression (no Dolphin)
        run: python -m unittest discover -s tests -p test_research_cli_clean_dolphin.py -v

  full-offline-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Full repository unit tests (no emulator)
        run: python -m unittest discover -s tests -v

name: P0 Golf NearPin sequence pointer source hygiene

on:
  push:
    paths:
      - 'scripts/audit_p0_golf_nearpin_sequence_roots_private.py'
      - 'tests/test_p0_golf_nearpin_sequence_roots_private.py'
      - '.github/workflows/p0-golf-nearpin-sequence-roots.yml'
  pull_request:
    paths:
      - 'scripts/audit_p0_golf_nearpin_sequence_roots_private.py'
      - 'tests/test_p0_golf_nearpin_sequence_roots_private.py'
      - '.github/workflows/p0-golf-nearpin-sequence-roots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile mode4 source-gated pointer reader
        run: python -m compileall -q scripts/audit_p0_golf_nearpin_sequence_roots_private.py tests/test_p0_golf_nearpin_sequence_roots_private.py
      - name: Fabricated sequence roots and provenance safety tests
        run: python -m unittest discover -s tests -p 'test_p0_golf_nearpin_sequence_roots_private.py' -v

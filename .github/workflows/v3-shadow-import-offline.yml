name: V3 Work Queue shadow import offline
on:
  pull_request:
    paths:
      - 'src/wii_ai_golf/orchestration/shadow_import.py'
      - 'tests/test_v3_shadow_import.py'
      - 'docs/v3-shadow-import.md'
      - '.github/workflows/v3-shadow-import-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m py_compile src/wii_ai_golf/orchestration/shadow_import.py tests/test_v3_shadow_import.py
      - run: python -m unittest discover -s tests -p 'test_v3_shadow_import.py' -v
      - run: python -m unittest discover -s tests -v

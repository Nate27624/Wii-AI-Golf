name: S002 selected-player-state B0-B3 synthetic
on:
  push:
    branches:
      - agent/research/selected-player-state-b0b3-20261027
  pull_request:
    paths:
      - scripts/audit_selected_player_state_four_phase_private.py
      - tests/test_selected_player_state_four_phase_private.py
      - .github/workflows/s002-selected-player-state-synthetic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    name: No-game PPC state audit / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify script compiles
        run: python -m py_compile scripts/audit_selected_player_state_four_phase_private.py tests/test_selected_player_state_four_phase_private.py
      - name: Run synthetic source / privacy regressions
        run: python -m unittest discover -s tests -p "test_selected_player_state_four_phase_private.py" -v

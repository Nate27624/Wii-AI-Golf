name: S001 WASD collision regression
on:
  pull_request:
    paths:
      - 'src/wii_ai_golf/integration/dolphin_controller_config.py'
      - 'tests/test_integration_mouse_isolation.py'
      - '.github/workflows/s001-wasd-safety-tests.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: windows-latest
    permissions:
      contents: read
    # Runner context is only available in step env, not job env.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check syntax
        run: python -m compileall -q src scripts tests
      - name: Focused S001 mapping and safety tests
        run: python -m unittest discover -s tests -p "test_integration_mouse_isolation.py" -v
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
      - name: Full regression offline
        run: python -m unittest discover -s tests -v
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

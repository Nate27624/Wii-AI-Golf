name: P0 seven cache tags synthetic

on:
  push:
    paths:
      - 'scripts/audit_p0_seven_cache_update_tags_private.py'
      - 'tests/test_p0_seven_cache_update_tags_private.py'
      - '.github/workflows/p0-seven-cache-tags-synthetic.yml'
  pull_request:
    paths:
      - 'scripts/audit_p0_seven_cache_update_tags_private.py'
      - 'tests/test_p0_seven_cache_update_tags_private.py'
      - '.github/workflows/p0-seven-cache-tags-synthetic.yml'
  workflow_dispatch:

jobs:
  linux-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -I -m unittest discover -s tests -p 'test_p0_seven_cache_update_tags_private.py' -v
  windows-synthetic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -I -m unittest discover -s tests -p 'test_p0_seven_cache_update_tags_private.py' -v

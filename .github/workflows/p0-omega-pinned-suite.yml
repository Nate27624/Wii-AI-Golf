name: P0 Omega pinned offline suite (fabricated only)
on:
  push:
    paths:
      - 'scripts/omega_p0_offline_private.py'
      - 'tests/test_p0_omega_offline_private.py'
      - 'scripts/Invoke-P0Omega.ps1'
      - '.github/workflows/p0-omega-pinned-suite.yml'
  pull_request:
    paths:
      - 'scripts/omega_p0_offline_private.py'
      - 'tests/test_p0_omega_offline_private.py'
      - 'scripts/Invoke-P0Omega.ps1'
      - '.github/workflows/p0-omega-pinned-suite.yml'
  workflow_dispatch:
jobs:
  fabricated:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit-test original 14-bank contract, reviewed pins and private-safe output
        run: python -m unittest discover -s tests -p test_p0_omega_offline_private.py -v
      - name: Isolated Python help from unrelated directory
        shell: bash
        run: |
          cd /tmp 2>/dev/null || cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/scripts/omega_p0_offline_private.py" --help
      - name: Parse PowerShell 5.1 launcher without executing any game data
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts\Invoke-P0Omega.ps1'),
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw 'PowerShell syntax invalid' }

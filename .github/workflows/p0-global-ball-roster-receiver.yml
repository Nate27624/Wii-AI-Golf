name: S002 P0 source global ball roster receiver

on:
  push:
    paths:
      - 'scripts/audit_p0_global_ball_roster_receiver_private.py'
      - 'tests/test_p0_global_ball_roster_receiver_private.py'
      - '.github/workflows/p0-global-ball-roster-receiver.yml'
  pull_request:
    paths:
      - 'scripts/audit_p0_global_ball_roster_receiver_private.py'
      - 'tests/test_p0_global_ball_roster_receiver_private.py'
      - '.github/workflows/p0-global-ball-roster-receiver.yml'
  workflow_dispatch:

jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run source roster identity and r31 source tests
        run: python -m unittest discover -s tests -p 'test_p0_global_ball_roster_receiver_private.py' -v

name: P0 seven SequenceMgr source score audit
on:
  push:
    paths:
      - 'scripts/audit_p0_seven_sequence_scores_private.py'
      - 'tests/test_p0_seven_sequence_scores_private.py'
      - '.github/workflows/p0-seven-sequence-scores.yml'
  pull_request:
    paths:
      - 'scripts/audit_p0_seven_sequence_scores_private.py'
      - 'tests/test_p0_seven_sequence_scores_private.py'
      - '.github/workflows/p0-seven-sequence-scores.yml'
  workflow_dispatch:
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic source contract, confound and privacy tests
        run: python -m unittest discover -s tests -p test_p0_seven_sequence_scores_private.py -v

name: S002 player-record source store candidates (synthetic)
on:
  push:
    paths:
      - 'scripts/audit_p0_player_record_store_candidates_private.py'
      - 'scripts/Invoke-P0PlayerStoreProvenance.ps1'
      - 'scripts/Invoke-P0R31StoreSlice.ps1'
      - 'tests/test_p0_player_record_store_candidates_private.py'
      - 'scripts/audit_p0_r31_store_slice_private.py'
      - 'scripts/audit_p0_r31_local_cfg_private.py'
      - 'scripts/audit_p0_r31_opcode_classes_private.py'
      - 'scripts/audit_p0_r31_qualified_local_paths_private.py'
      - 'scripts/Invoke-P0R31QualifiedPaths.ps1'
      - 'scripts/Invoke-P0R31OpcodeQualification.ps1'
      - 'scripts/Invoke-P0R31LocalCfg.ps1'
      - 'tests/test_p0_r31_store_slice_private.py'
      - 'tests/test_p0_r31_local_cfg_private.py'
      - 'tests/test_p0_r31_opcode_classes_private.py'
      - 'tests/test_p0_r31_qualified_local_paths_private.py'
      - '.github/workflows/p0-player-record-store-candidates.yml'
  pull_request:
    paths:
      - 'scripts/audit_p0_player_record_store_candidates_private.py'
      - 'scripts/Invoke-P0PlayerStoreProvenance.ps1'
      - 'scripts/Invoke-P0R31StoreSlice.ps1'
      - 'tests/test_p0_player_record_store_candidates_private.py'
      - 'scripts/audit_p0_r31_store_slice_private.py'
      - 'scripts/audit_p0_r31_local_cfg_private.py'
      - 'scripts/audit_p0_r31_opcode_classes_private.py'
      - 'scripts/audit_p0_r31_qualified_local_paths_private.py'
      - 'scripts/Invoke-P0R31QualifiedPaths.ps1'
      - 'scripts/Invoke-P0R31OpcodeQualification.ps1'
      - 'scripts/Invoke-P0R31LocalCfg.ps1'
      - 'tests/test_p0_r31_store_slice_private.py'
      - 'tests/test_p0_r31_local_cfg_private.py'
      - 'tests/test_p0_r31_opcode_classes_private.py'
      - 'tests/test_p0_r31_qualified_local_paths_private.py'
      - '.github/workflows/p0-player-record-store-candidates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Source-only synthetic negative controls
        run: python -m unittest discover -s tests -p 'test_p0_player_record_store_candidates_private.py' -v
      - name: Extra bounded r31 site source-only synthetic regressions
        run: python -m unittest discover -s tests -p 'test_p0_r31_store_slice_private.py' -v
      - name: Local PPC CFG synthesized controls
        run: python -m unittest discover -s tests -p 'test_p0_r31_local_cfg_private.py' -v
      - name: PPC GPR31 exact opcode fabricated regression tests
        run: python -m unittest discover -s tests -p 'test_p0_r31_opcode_classes_private.py' -v
      - name: PPC R31 local refined path source-only fabricated tests
        run: python -m unittest discover -s tests -p 'test_p0_r31_qualified_local_paths_private.py' -v
      - name: Parse scripts without native ROM or RAM
        run: python -m compileall -q scripts/audit_p0_player_record_store_candidates_private.py tests/test_p0_player_record_store_candidates_private.py scripts/audit_p0_r31_store_slice_private.py tests/test_p0_r31_store_slice_private.py scripts/audit_p0_r31_local_cfg_private.py tests/test_p0_r31_local_cfg_private.py scripts/audit_p0_r31_opcode_classes_private.py tests/test_p0_r31_opcode_classes_private.py scripts/audit_p0_r31_qualified_local_paths_private.py tests/test_p0_r31_qualified_local_paths_private.py
      - name: PowerShell 5.1 operator wrapper syntax only
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Invoke-P0PlayerStoreProvenance.ps1').Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('PowerShell parse errors: ' + $errors.Count) }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Invoke-P0R31StoreSlice.ps1').Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('R31 wrapper parse errors: ' + $errors.Count) }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Invoke-P0R31LocalCfg.ps1').Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('P0 local CFG wrapper parse errors: ' + $errors.Count) }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Invoke-P0R31OpcodeQualification.ps1').Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('P0 opcode wrapper parse errors: ' + $errors.Count) }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Invoke-P0R31QualifiedPaths.ps1').Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('P0 refined R31 wrapper parse errors: ' + $errors.Count) }


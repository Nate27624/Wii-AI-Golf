name: S002 Ball-KCL coordinate basis (offline)

on:
  pull_request:
    paths:
      - 'scripts/review_p0_ball_kcl_basis_provenance.py'
      - 'tests/test_p0_ball_kcl_basis_provenance.py'
      - 'research/studies/S002-P0-COORDINATE-BASIS-20261121.md'
      - '.github/workflows/s002-ball-kcl-coordinate-basis-offline.yml'

permissions:
  contents: read

jobs:
  basis-provenance-offline:
    name: S002 basis / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install full-suite dependency
        run: python -m pip install numpy
      - name: Compile bounded offline validator and tests
        run: python -m py_compile scripts/review_p0_ball_kcl_basis_provenance.py tests/test_p0_ball_kcl_basis_provenance.py
      - name: Focused Ball/KCL coordinate provenance tests
        run: python -m unittest discover -s tests -p 'test_p0_ball_kcl_basis_provenance.py' -v
      - name: Full offline regression
        run: python -m unittest discover -s tests -v

name: P0 seven-capture label-agnostic graph (synthetic)
on:
  push:
    paths:
      - 'scripts/audit_p0_seven_label_free_graph_private.py'
      - 'tests/test_p0_seven_label_free_graph_private.py'
      - '.github/workflows/p0-seven-label-free-graph.yml'
  pull_request:
    paths:
      - 'scripts/audit_p0_seven_label_free_graph_private.py'
      - 'tests/test_p0_seven_label_free_graph_private.py'
      - '.github/workflows/p0-seven-label-free-graph.yml'
  workflow_dispatch:
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test synthetic label-free graphs, privacy, SHA drift and isolated Python imports
        run: python -m unittest discover -s tests -p test_p0_seven_label_free_graph_private.py -v

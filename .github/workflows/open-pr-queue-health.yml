name: Read-only open PR queue health

on:
  pull_request:
    paths:
      - 'scripts/audit_open_pr_queue.py'
      - 'tests/test_open_pr_queue_audit.py'
      - 'research/reviews/OPEN-PR-QUEUE-HEALTH.md'
      - '.github/workflows/open-pr-queue-health.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read
  pull-requests: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synthetic safe PR queue analysis (no GitHub API or Dolphin)
        run: python -m unittest discover -s tests -p test_open_pr_queue_audit.py -v
      - name: Compile source (no game)
        run: python -m py_compile scripts/audit_open_pr_queue.py

  safe-queue-snapshot:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch READ-ONLY PR metadata and save allowlisted aggregates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/audit_open_pr_queue.py --github --out pr-queue-health.json
      - name: Automatically upload sanitized queue artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-pr-queue-health
          path: pr-queue-health.json
          if-no-files-found: error
          retention-days: 14

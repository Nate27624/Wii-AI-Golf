name: P0 offline Dolphin executable identity synthetic
on:
  push:
    paths:
      - 'research/tools/Get-P0InstalledDolphinIdentity.ps1'
      - 'research/studies/P0-INSTALLED-FELK-BINARY-IDENTITY-01.md'
      - '.github/workflows/p0-installed-felk-binary-identity.yml'
  pull_request:
    paths:
      - 'research/tools/Get-P0InstalledDolphinIdentity.ps1'
      - 'research/studies/P0-INSTALLED-FELK-BINARY-IDENTITY-01.md'
      - '.github/workflows/p0-installed-felk-binary-identity.yml'
  workflow_dispatch:
jobs:
  offline-synthetic-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed on PowerShell 5.1 parsing errors
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = (Resolve-Path '.\\research\\tools\\Get-P0InstalledDolphinIdentity.ps1').Path
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $script, [ref]$tokens, [ref]$parseErrors)
          if ($null -ne $parseErrors -and $parseErrors.Count -gt 0) {
            throw "PowerShell probe syntax invalid"
          }
      - name: Local generated PE header and fail-closed selftests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\research\tools\Get-P0InstalledDolphinIdentity.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Offline P0 PE identity selftest failed' }

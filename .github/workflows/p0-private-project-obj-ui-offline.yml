name: P0 inspector private project OBJ startup offline

on:
  pull_request:
    paths:
      - 'src/wii_ai_golf/inspector/terrain.py'
      - 'src/wii_ai_golf/inspector/gui.py'
      - 'scripts/p0_memory_inspector.py'
      - 'tests/test_p0_memory_inspector_terrain.py'
      - 'tests/test_p0_memory_inspector_terrain_launch.py'
      - '.github/workflows/p0-private-project-obj-ui-offline.yml'
  push:
    branches:
      - agent/inspector-private-project-obj-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Project-private OBJ path safety tests
        run: python -m unittest discover -s tests -p test_p0_memory_inspector_terrain.py -v
      - name: Startup CLI OBJ tests
        run: python -m unittest discover -s tests -p test_p0_memory_inspector_terrain_launch.py -v
      - name: Full repository offline suite
        run: python -m unittest discover -s tests -v

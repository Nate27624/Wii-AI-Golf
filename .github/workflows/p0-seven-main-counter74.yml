name: P0 Main plus 74 counter ordinal synthetic

on:
  push:
    branches:
      - 'agent/research/p0-seven-main-counter-phase-controls-20261028'
  pull_request:
    paths:
      - 'scripts/audit_p0_seven_main_counter74_private.py'
      - 'tests/test_p0_seven_main_counter74_private.py'
      - '.github/workflows/p0-seven-main-counter74.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline synthetic-only tests - no native RAM or emulator
        run: python -m unittest discover -s tests -p "test_p0_seven_main_counter74_private.py" -v

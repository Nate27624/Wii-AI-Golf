name: S001 P0 V1 no-A pretrace single-factor offline tests
on:
  pull_request:
    paths:
      - 'scripts/record_selected_ball_swing_v1_private.py'
      - 'scripts/analyze_selected_player_swing_words_private.py'
      - 'tests/test_s001_v1_no_a_pretrace_single_factor.py'
      - '.github/workflows/s001-v1-no-a-pretrace-single-factor.yml'
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing and new V1 regression tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_s001_v1_*.py' -v
      - name: Compile
        run: python -m compileall -q scripts/record_selected_ball_swing_v1_private.py scripts/analyze_selected_player_swing_words_private.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Existing and new V1 regression tests
        run: |
          $env:PYTHONPATH = 'src'
          python -m unittest discover -s tests -p 'test_s001_v1_*.py' -v
      - name: Compile
        run: python -m compileall -q scripts/record_selected_ball_swing_v1_private.py scripts/analyze_selected_player_swing_words_private.py

name: S001 ball watch in-frame read contract (synthetic)
on:
  push:
    branches:
      - agent/research/ball-sampler-frame-read-contract
  pull_request:
    paths:
      - src/wii_ai_golf/integration/ball_watch_preflight.py
      - tests/test_ball_watch_preflight.py
      - .github/workflows/s001-ball-frame-watch-offline.yml
jobs:
  focused:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile preflight and tests
        run: python -m py_compile src/wii_ai_golf/integration/ball_watch_preflight.py tests/test_ball_watch_preflight.py
      - name: Offline native memory mock gates
        run: python -m unittest discover -s tests -p "test_ball_watch_preflight.py" -v
